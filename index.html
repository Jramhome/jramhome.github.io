.logo{transform-origin:0 0;animation:grow var(--t) ease-in-out infinite alternate}
@keyframes grow{from{transform:scale(1)}to{transform:scale(1.1)}}
.ray{transform-box:fill-box;transform-origin:0% 50%;animation:out var(--t) ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes out{from{transform:translateX(0) scaleX(1)}to{transform:translateX(var(--m)) scaleX(var(--s))}}
.tick{transform-box:fill-box;transform-origin:100% 50%;animation:inn var(--t) ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes inn{from{transform:translateX(0) scaleX(1);opacity:var(--o)}to{transform:translateX(-8px) scaleX(.6);opacity:calc(var(--o)*.6)}}
.ring{animation:ring var(--t) ease-in-out infinite alternate}
@keyframes ring{from{stroke-width:5}to{stroke-width:6.6}}
@media (prefers-reduced-motion:reduce){.logo,.ray,.tick,.ring{animation:none}}
</style>
